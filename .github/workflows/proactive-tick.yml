name: Proactive tick preview

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_candidates:
        description: "Run synthetic candidate checks (simulation only)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  proactive-tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run read-only proactive tick
        env:
          LINJIAN_SERVER_URL: ${{ secrets.LINJIAN_SERVER_URL }}
          LINJIAN_SCHEDULER_TOKEN: ${{ secrets.LINJIAN_SCHEDULER_TOKEN }}
          TEST_CANDIDATES: ${{ github.event_name == 'workflow_dispatch' && inputs.test_candidates == true }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${LINJIAN_SERVER_URL}" || -z "${LINJIAN_SCHEDULER_TOKEN}" ]]; then
            echo "::error::LINJIAN_SERVER_URL or LINJIAN_SCHEDULER_TOKEN is not configured."
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          tick_url="${LINJIAN_SERVER_URL%/}/api/proactive/tick"
          request_payload='{"simulate":true}'

          if [[ "${TEST_CANDIDATES}" == "true" ]]; then
            run_suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            candidates_json="$(jq -cn \
              --arg device_id "preview-test-${run_suffix}" \
              --arg run_suffix "${run_suffix}" \
              '[
                {
                  device_id: $device_id,
                  event_id: ("preview-send-" + $run_suffix),
                  topic: ("preview-send-" + $run_suffix),
                  message: "READ_ONLY_TEST",
                  expires_at: "2099-12-31T23:59:59Z"
                },
                {
                  device_id: $device_id,
                  event_id: ("preview-skip-" + $run_suffix),
                  topic: ("preview-skip-" + $run_suffix),
                  message: "READ_ONLY_TEST",
                  expires_at: "2000-01-01T00:00:00Z"
                }
              ]')"
            request_payload="$(jq -cn --argjson candidates "$candidates_json" '{simulate:true,candidates:$candidates}')"
          fi

          if ! http_status="$(curl --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              --output "$response_file" --write-out '%{http_code}' \
              --request POST "$tick_url" \
              --header 'Content-Type: application/json' \
              --header "X-Scheduler-Token: ${LINJIAN_SCHEDULER_TOKEN}" \
              --data "$request_payload")"; then
            echo "::error::The proactive tick request could not be completed."
            exit 1
          fi

          if [[ "$http_status" != "200" ]]; then
            echo "::error::Proactive tick returned HTTP ${http_status}."
            exit 1
          fi

          if ! jq --exit-status '.ok == true and .simulated == true' "$response_file" >/dev/null; then
            echo "::error::Proactive tick returned an unexpected success payload."
            exit 1
          fi

          safe_stat() {
            local label="$1"
            local filter="$2"
            local value
            value="$(jq --raw-output "$filter" "$response_file" 2>/dev/null || true)"
            if [[ -n "$value" && "$value" != "null" ]]; then
              printf '%s: %s\n' "$label" "$value"
            else
              printf '%s: unavailable\n' "$label"
            fi
          }

          echo "Proactive tick simulation completed successfully (HTTP 200)."
          echo "Proactive tick preview statistics:"
          safe_stat "generated_candidates" 'if (.generated_candidates | type) == "number" then .generated_candidates else empty end'
          safe_stat "due_source_checks" 'if (.source_results | type) == "array" then (.source_results | length) else empty end'
          safe_stat "direct_candidate_checks" 'if (.results | type) == "array" then (.results | length) else empty end'
          safe_stat "source_decision_send" 'if (.source_results | type) == "array" then (.source_results | map(select(.decision == "send")) | length) else empty end'
          safe_stat "source_decision_defer" 'if (.source_results | type) == "array" then (.source_results | map(select(.decision == "defer")) | length) else empty end'
          safe_stat "source_decision_skip" 'if (.source_results | type) == "array" then (.source_results | map(select(.decision == "skip")) | length) else empty end'
          safe_stat "direct_decision_send" 'if (.results | type) == "array" then (.results | map(select(.decision == "send")) | length) else empty end'
          safe_stat "direct_decision_defer" 'if (.results | type) == "array" then (.results | map(select(.decision == "defer")) | length) else empty end'
          safe_stat "direct_decision_skip" 'if (.results | type) == "array" then (.results | map(select(.decision == "skip")) | length) else empty end'
